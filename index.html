  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x 56px 72px;\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 6px var(--cream), 0 0 0 7px var(--ink); /* double-ruled inset */\n    position: relative;\n    background: var(--cream);\n    text-align: center;\n  }\n  .hero::before, .hero::after {\n    content: \"\"; position: absolute; width: 14px; height: 14px;\n    border: 1px solid var(--terracotta);\n    transform: rotate(45deg);\n    background: var(--cream);\n  }\n  .hero::before { top: -7px; left: 50%; margin-left: -7px; }\n  .hero::after { bottom: -7px; left: 50%; margin-left: -7px; }\n  @media (max-width: 720px) { .hero { padding: 44px 22px 52px; } }\n\n  .eyebrow {\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    letter-spacing: 0.32em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    margin-bottom: 28px;\n  }\n  .eyebrow .swash { color: var(--gold-tan); margin: 0 10px; }\n\n  .invites {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: clamp(15px, 1.6vw, 18px);\n    color: var(--ink-soft);\n    margin: 0 0 14px;\n    letter-spacing: 0.01em;\n  }\n  .invites-name {\n    color: var(--terracotta);\n    text-decoration: none;\n    border-bottom: none;\n  }\n\n  h1.title {\n    font-family: 'Playfair Display', serif;\n    font-weight: 500;\n    font-style: italic;\n    font-size: clamp(48px, 8.4vw, 104px);\n    line-height: 0.98;\n    letter-spacing: -0.012em;\n    margin: 0 0 28px;\n    color: var(--ink);\n  }\n  h1.title .amp { color: var(--terracotta); font-style: italic; }\n\n  .tagline {\n    font-family: 'Playfair Display', serif;\n    font-size: clamp(18px, 2.1vw, 22px);\n    line-height: 1.5;\n    color: var(--ink-soft);\n    max-width: 560px;\n    margin: 0 auto;\n    font-style: italic;\n  }\n\n  .hero-meta {\n    margin-top: 40px;\n    display: flex;\n    justify-content: center;\n    gap: 36px;\n    flex-wrap: wrap;\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n  }\n  .hero-meta span b { color: var(--ink); font-weight: 500; display: block; margin-top: 4px; letter-spacing: 0.18em;}\n\n  /* dividers */\n  .divider {\n    display: flex; align-items: center; justify-content: center;\n    gap: 18px;\n    margin: 88px 0;\n    color: var(--terracotta);\n  }\n  .divider .line { flex: 1; max-width: 200px; height: 1px; background: var(--ink); opacity: 0.45; }\n  .divider .glyph { font-family: 'Playfair Display', serif; font-size: 18px; }\n\n  /* section */\n  section { scroll-margin-top: 40px; }\n  .section-num {\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    letter-spacing: 0.32em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    margin-bottom: 16px;\n    display: flex; align-items: center; gap: 14px;\n  }\n  .section-num .bar { width: 28px; height: 1px; background: var(--terracotta); }\n\n  h2 {\n    font-family: 'Playfair Display', serif;\n    font-weight: 500;\n    font-size: clamp(34px, 4.6vw, 52px);\n    line-height: 1.05;\n    letter-spacing: -0.01em;\n    margin: 0 0 28px;\n    color: var(--ink);\n  }\n  h2 em { font-style: italic; color: var(--terracotta); }\n\n  .lede {\n    font-size: 19px;\n    line-height: 1.7;\n    color: var(--ink-soft);\n    max-width: 640px;\n  }\n  .lede + .lede { margin-top: 18px; }\n\n  .two-col {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 56px;\n    align-items: start;\n  }\n  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; gap: 32px; } }\n\n  /* concept side ornament */\n  .concept-ornament {\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 4px var(--cream), 0 0 0 5px var(--ink);\n    padding: 36px 32px;\n    background: var(--cream-deep);\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 21px;\n    line-height: 1.5;\n    color: var(--ink);\n    position: relative;\n  }\n  .concept-ornament::before {\n    content: \"“\";\n    font-size: 88px;\n    line-height: 1;\n    color: var(--terracotta);\n    position: absolute;\n    top: 12px; left: 18px;\n    font-family: 'Playfair Display', serif;\n  }\n  .concept-ornament .quote {\n    padding-left: 44px;\n  }\n  .concept-ornament .attr {\n    margin-top: 22px;\n    font-family: 'DM Mono', monospace;\n    font-style: normal;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    padding-left: 44px;\n  }\n\n  /* agenda cards */\n  .agenda-grid {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;\n  }\n  @media (max-width: 820px) { .agenda-grid { grid-template-columns: 1fr; } }\n\n  .card {\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 4px var(--cream), 0 0 0 5px var(--ink);\n    padding: 36px 32px 32px;\n    background: var(--cream);\n    position: relative;\n  }\n  .card .ribbon {\n    position: absolute; top: -12px; left: 24px;\n    background: var(--cream);\n    padding: 0 12px;\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n  }\n  .card h3 {\n    font-family: 'Playfair Display', serif;\n    font-weight: 500;\n    font-style: italic;\n    font-size: 26px;\n    margin: 6px 0 6px;\n    color: var(--ink);\n  }\n  .card .when {\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.24em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    margin-bottom: 22px;\n  }\n  .agenda-list {\n    list-style: none; padding: 0; margin: 0;\n  }\n  .agenda-list li {\n    display: grid;\n    grid-template-columns: 28px 1fr;\n    gap: 8px;\n    padding: 12px 0;\n    border-top: 1px solid rgba(44, 26, 14, 0.18);\n    font-size: 15.5px;\n    line-height: 1.55;\n    color: var(--ink);\n  }\n  .agenda-list li:first-child { border-top: 1px solid var(--ink); }\n  .agenda-list li .step {\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    color: var(--terracotta);\n    letter-spacing: 0.18em;\n    padding-top: 3px;\n  }\n\n  /* locations */\n  .chips {\n    display: flex; flex-wrap: wrap; gap: 12px;\n    margin-top: 28px;\n  }\n  .chip {\n    border: 1px solid var(--ink);\n    padding: 10px 18px 10px 14px;\n    border-radius: 999px;\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 17px;\n    color: var(--ink);\n    background: var(--cream);\n    transition: background 200ms ease, color 200ms ease;\n  }\n  .chip:hover { background: var(--terracotta); color: var(--cream); border-color: var(--terracotta); }\n  .chip:hover .chip-tag { color: var(--cream); border-color: rgba(245,237,227,0.6); }\n  .chip .chip-tag {\n    font-family: 'DM Mono', monospace;\n    font-style: normal;\n    font-size: 9px;\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    border: 1px solid currentColor;\n    padding: 2px 6px;\n    border-radius: 999px;\n  }\n\n  /* form */\n  .form-wrap {\n    margin-top: 12px;\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 6px var(--cream), 0 0 0 7px var(--ink);\n    padding: 56px 56px 60px;\n    background: var(--cream);\n  }\n  @media (max-width: 720px) { .form-wrap { padding: 36px 24px 44px; } }\n\n  .form-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 28px 32px;\n  }\n  .form-grid .full { grid-column: 1 / -1; }\n  @media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }\n\n  .field { display: flex; flex-direction: column; gap: 8px; }\n  .field label {\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n  }\n  .field label .opt {\n    color: var(--ink-soft);\n    margin-left: 6px;\n    letter-spacing: 0.18em;\n    text-transform: none;\n  }\n  .field input,\n  .field textarea,\n  .field select {\n    font-family: 'Lora', Georgia, serif;\n    font-size: 16px;\n    color: var(--ink);\n    background: transparent;\n    border: none;\n    border-bottom: 1px solid var(--ink);\n    padding: 10px 0 8px;\n    outline: none;\n    border-radius: 0;\n    appearance: none;\n    -webkit-appearance: none;\n    transition: border-color 200ms ease;\n  }\n  .field input:focus,\n  .field textarea:focus,\n  .field select:focus {\n    border-bottom-color: var(--terracotta);\n    box-shadow: 0 1px 0 0 var(--terracotta);\n  }\n  .field textarea {\n    min-height: 96px;\n    resize: vertical;\n    border: 1px solid var(--ink);\n    padding: 14px 16px;\n    line-height: 1.55;\n  }\n  .field textarea:focus { border-color: var(--terracotta); box-shadow: 0 0 0 1px var(--terracotta); }\n  .field .select-wrap { position: relative; }\n  .field .select-wrap::after {\n    content: \"\";\n    position: absolute;\n    right: 4px; top: 18px;\n    width: 8px; height: 8px;\n    border-right: 1px solid var(--ink);\n    border-bottom: 1px solid var(--ink);\n    transform: rotate(45deg);\n    pointer-events: none;\n  }\n  .field .hint {\n    font-family: 'Lora', serif;\n    font-style: italic;\n    font-size: 13px;\n    color: var(--ink-soft);\n  }\n  .field.has-error input,\n  .field.has-error textarea,\n  .field.has-error select {\n    border-bottom-color: var(--terracotta);\n  }\n  .field.has-error textarea { border-color: var(--terracotta); }\n  .field .err {\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    display: none;\n  }\n  .field.has-error .err { display: block; }\n\n  .submit-row {\n    margin-top: 40px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 24px;\n    flex-wrap: wrap;\n    border-top: 1px solid var(--ink);\n    padding-top: 28px;\n  }\n  .rsvp-note {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 16px;\n    color: var(--ink-soft);\n    max-width: 360px;\n  }\n  .submit {\n    appearance: none;\n    border: 1px solid var(--ink);\n    background: var(--ink);\n    color: var(--cream);\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 19px;\n    padding: 16px 30px;\n    cursor: pointer;\n    letter-spacing: 0.005em;\n    display: inline-flex;\n    align-items: center;\n    gap: 14px;\n    transition: background 200ms ease, color 200ms ease;\n  }\n  .submit:hover { background: var(--terracotta); border-color: var(--terracotta); color: var(--cream); }\n  .submit .arrow { font-family: 'DM Mono', monospace; font-style: normal; font-size: 14px; }\n\n  /* confirmation */\n  .confirm {\n    text-align: center;\n    padding: 32px 16px 8px;\n  }\n  .confirm .seal {\n    width: 72px; height: 72px; border: 1px solid var(--terracotta);\n    border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    color: var(--terracotta);\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 30px;\n    margin-bottom: 24px;\n    position: relative;\n  }\n  .confirm .seal::before, .confirm .seal::after {\n    content: \"\"; position: absolute; left: -10px; right: -10px;\n    height: 1px; background: var(--terracotta); opacity: 0.4;\n  }\n  .confirm .seal::before { top: 50%; transform: translateY(-6px); }\n  .confirm .seal::after  { top: 50%; transform: translateY(5px); }\n  .confirm h3 {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-weight: 500;\n    font-size: 38px;\n    margin: 0 0 18px;\n    color: var(--ink);\n  }\n  .confirm p {\n    max-width: 520px;\n    margin: 0 auto 14px;\n    color: var(--ink-soft);\n    font-size: 17px;\n  }\n  .confirm .next {\n    margin-top: 32px;\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n  }\n  .confirm .reset {\n    margin-top: 22px;\n    background: none; border: none; color: var(--ink-soft);\n    font-family: 'Lora', serif; font-style: italic;\n    text-decoration: underline; text-underline-offset: 4px;\n    cursor: pointer; font-size: 14px;\n  }\n  .confirm .reset:hover { color: var(--terracotta); }\n\n  /* footer */\n  footer {\n    margin-top: 96px;\n    padding-top: 28px;\n    border-top: 1px solid var(--ink);\n    box-shadow: 0 -3px 0 -1px var(--cream), 0 -4px 0 -1px var(--ink);\n    display: flex; justify-content: space-between; align-items: center;\n    font-family: 'DM Mono', monospace;\n    font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;\n    color: var(--ink-soft);\n    flex-wrap: wrap;\n    gap: 16px;\n  }\n  footer .signed {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 15px;\n    letter-spacing: 0;\n    text-transform: none;\n    color: var(--ink);\n  }\n\n  /* sketch */\n  .sketch-wrap {\n    margin-top: 56px;\n    display: flex;\n    justify-content: center;\n  }\n  .sketch-frame {\n    max-width: 520px;\n    width: 100%;\n    padding: 18px;\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 4px var(--cream), 0 0 0 5px var(--ink);\n    background: var(--cream-deep);\n    text-align: center;\n  }\n  .sketch-frame img { width: 100%; height: auto; display: block; mix-blend-mode: multiply; }\n  .sketch-cap {\n    margin-top: 12px;\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n  }\n\n  /* room photo */\n  .room-photo {\n    margin-top: 36px;\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 4px var(--cream), 0 0 0 5px var(--ink);\n    overflow: hidden;\n    position: relative;\n  }\n  .room-photo img { width: 100%; height: auto; display: block; }\n  .room-photo .caption {\n    position: absolute;\n    left: 18px; bottom: 14px;\n    background: var(--cream);\n    border: 1px solid var(--ink);\n    padding: 6px 12px;\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.24em;\n    text-transform: uppercase;\n    color: var(--ink);\n  }\n  .room-photo .caption b { color: var(--terracotta); font-weight: 500; }\n\n  /* rsvp card */\n  .rsvp-card {\n    display: grid;\n    grid-template-columns: 0.85fr 1.15fr;\n    border: 1px solid var(--ink);\n    box-shadow: 0 0 0 6px var(--cream), 0 0 0 7px var(--ink);\n    background: var(--cream);\n  }\n  @media (max-width: 820px) { .rsvp-card { grid-template-columns: 1fr; } }\n\n  .rsvp-how {\n    padding: 44px 40px;\n    background: var(--cream-deep);\n    border-right: 1px solid var(--ink);\n    display: flex;\n    flex-direction: column;\n  }\n  @media (max-width: 820px) { .rsvp-how { border-right: none; border-bottom: 1px solid var(--ink); } }\n  .rsvp-how-label, .rsvp-prep-label {\n    font-family: 'DM Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--terracotta);\n    margin-bottom: 18px;\n  }\n  .rsvp-how-text {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 22px;\n    line-height: 1.45;\n    color: var(--ink);\n    margin: 0;\n  }\n  .rsvp-signed {\n    margin-top: auto;\n    padding-top: 28px;\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 17px;\n    color: var(--terracotta);\n  }\n\n  .rsvp-prep { padding: 44px 40px; }\n  .prep-list { list-style: none; margin: 0; padding: 0; }\n  .prep-list li {\n    display: grid;\n    grid-template-columns: 40px 1fr;\n    gap: 14px;\n    padding: 18px 0;\n    border-top: 1px solid rgba(44, 26, 14, 0.18);\n  }\n  .prep-list li:first-child { border-top: none; padding-top: 0; }\n  .prep-list li:last-child { padding-bottom: 0; }\n  .prep-num {\n    font-family: 'Playfair Display', serif;\n    font-style: italic;\n    font-size: 22px;\n    color: var(--gold-tan);\n    line-height: 1.1;\n  }\n  .prep-body strong {\n    display: block;\n    font-family: 'Playfair Display', serif;\n    font-weight: 500;\n    font-size: 19px;\n    color: var(--ink);\n    margin-bottom: 4px;\n  }\n  .prep-body span {\n    display: block;\n    font-size: 15px;\n    line-height: 1.55;\n    color: var(--ink-soft);\n  }\n\n  .fade-in { animation: fade 500ms ease both; }\n  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n\n  <div class=\"page\">\n    <div class=\"mast\">\n      <div>The Builder Table <span class=\"dot\"><\u002Fspan> An Invitation<\u002Fdiv>\n      <div>Summer · MMXXVI<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- HERO -->\n    <header class=\"hero\" data-screen-label=\"01 Hero\">\n      <div class=\"eyebrow\">Vol. I <span class=\"swash\">✦<\u002Fspan> A Standing Invitation <span class=\"swash\">✦<\u002Fspan> No. 001<\u002Fdiv>\n      <p class=\"invites\"><span class=\"invites-name\">Dilnaz<\u002Fspan> invites you to join<\u002Fp>\n      <h1 class=\"title\">The Builder<br>Table<\u002Fh1>\n      <p class=\"tagline\">A gathering for women who are building something — and don’t want to do it alone.<\u002Fp>\n      <div class=\"hero-meta\">\n        <span>Brought to you by <b>Dilnaz<\u002Fb><\u002Fspan>\n        <span>Cadence <b>Weekly · Saturdays<\u002Fb><\u002Fspan>\n        <span>Dress <b>Whatever Feels Like You<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"sketch-wrap\">\n      <figure class=\"sketch-frame\" style=\"margin:0;\">\n        <img src=\"04148954-0f80-409a-b30e-3cf0c32842d7\" alt=\"A sketch of a long table with seven chairs and the words Linger Longer above\">\n        <figcaption class=\"sketch-cap\">— the house motto, more or less —<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <div class=\"divider\"><div class=\"line\"><\u002Fdiv><span class=\"glyph\">✦<\u002Fspan><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n\n    <!-- CONCEPT -->\n    <section data-screen-label=\"02 What Is It\">\n      <div class=\"section-num\"><span class=\"bar\"><\u002Fspan><span>I. The Concept<\u002Fspan><\u002Fdiv>\n      <div class=\"two-col\">\n        <div>\n          <h2>What is the <em>Builder Table<\u002Fem>?<\u002Fh2>\n          <p class=\"lede\">A gathering space for female professionals to work on their passion projects together — in a warm, supportive environment that feels less like a coworking space and more like a long Sunday afternoon at a friend’s apartment.<\u002Fp>\n          <p class=\"lede\">Whether you’re starting from scratch or have been quietly developing an idea for a while, this doesn’t have to be a lonely journey. Join the table, share what you’re working on, grab a coffee, and start building together — sometimes interrupted by brunch and a sharing session with feedback and lessons learned.<\u002Fp>\n        <\u002Fdiv>\n        <aside class=\"concept-ornament\">\n          <div class=\"quote\">Pull up a chair. Open the laptop. Order another coffee. Tell us what you’re making — and let’s make it a little less lonely.<\u002Fdiv>\n          <div class=\"attr\">— The House Rule<\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"divider\"><div class=\"line\"><\u002Fdiv><span class=\"glyph\">✦ ✦ ✦<\u002Fspan><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n\n    <!-- AGENDA -->\n    <section data-screen-label=\"03 How It Works\">\n      <div class=\"section-num\"><span class=\"bar\"><\u002Fspan><span>II. How a Saturday Goes<\u002Fspan><\u002Fdiv>\n      <h2>An example <em>flow<\u002Fem>.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-bottom: 44px;\">Not a fixed schedule — just the shape it tends to take. It starts with an introduction, and from there each week we work, share feedback, and repeat. Come to one, come to all. The chair is yours either way.<\u002Fp>\n\n      <div class=\"agenda-grid\">\n        <article class=\"card\">\n          <span class=\"ribbon\">No. 01 · The Opening<\u002Fspan>\n          <h3>Introductions &amp; Brunch<\u002Fh3>\n          <ul class=\"agenda-list\">\n            <li><span class=\"step\">i.<\u002Fspan><span>Arrivals, coffee, the slow circling of the table<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">ii.<\u002Fspan><span>Open-table sharing — what are you building, and why now?<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">iii.<\u002Fspan><span>Early discussion: where you’re stuck, what you’re unsure of<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">iv.<\u002Fspan><span>Set intentions for the next stretch of work<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"card\">\n          <span class=\"ribbon\">No. 02 · The Ongoing<\u002Fspan>\n          <h3>Work, Feedback, Repeat<\u002Fh3>\n          <ul class=\"agenda-list\">\n            <li><span class=\"step\">i.<\u002Fspan><span>Focused work time — heads down, side by side<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">ii.<\u002Fspan><span>Iteration on what you brought last time<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">iii.<\u002Fspan><span>Peer feedback in small clusters<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">iv.<\u002Fspan><span>Lessons learned — short, candid, written down<\u002Fspan><\u002Fli>\n            <li><span class=\"step\">v.<\u002Fspan><span>Accountability check-ins for the week ahead<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"divider\"><div class=\"line\"><\u002Fdiv><span class=\"glyph\">✦<\u002Fspan><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n\n    <!-- LOCATIONS -->\n    <section data-screen-label=\"04 Where\">\n      <div class=\"section-num\"><span class=\"bar\"><\u002Fspan><span>III. Where We Meet<\u002Fspan><\u002Fdiv>\n      <div class=\"two-col\">\n        <div>\n          <h2>Rotating <em>rooms<\u002Fem>, one long table.<\u002Fh2>\n          <p class=\"lede\">The table moves. Sometimes it’s a real one with too many chairs and too much bread; sometimes it’s a corner of a café with the right kind of light. Hosts rotate, the warmth doesn’t.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"chips\">\n            <span class=\"chip\"><span class=\"chip-tag\">A<\u002Fspan>The ETHR Lounge — the big table<\u002Fspan>\n            <span class=\"chip\"><span class=\"chip-tag\">B<\u002Fspan>Someone’s living room<\u002Fspan>\n            <span class=\"chip\"><span class=\"chip-tag\">C<\u002Fspan>MBZUAI campus<\u002Fspan>\n            <span class=\"chip\"><span class=\"chip-tag\">D<\u002Fspan>A café with the right light<\u002Fspan>\n            <span class=\"chip\"><span class=\"chip-tag\">E<\u002Fspan>Rotating hosts &amp; pop-ups<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <figure class=\"room-photo\" style=\"margin: 56px 0 0;\">\n        <img src=\"2783ce60-3105-4484-9a01-9e72f241fd36\" alt=\"A Parisian living room with a pink velvet sofa, gilded frames, and silk pillows\">\n        <figcaption class=\"caption\"><b>Mood<\u002Fb> &nbsp;·&nbsp; somewhere between a salon and a kitchen<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <div class=\"divider\"><div class=\"line\"><\u002Fdiv><span class=\"glyph\">✦ ✦ ✦<\u002Fspan><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n\n    <!-- RSVP -->\n    <section id=\"rsvp\" data-screen-label=\"05 RSVP\">\n      <div class=\"section-num\"><span class=\"bar\"><\u002Fspan><span>IV. The Reply Card<\u002Fspan><\u002Fdiv>\n      <h2>Reserve a <em>seat<\u002Fem> at the table.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-bottom: 36px;\">There’s no form to fill in. Just <strong>message me directly<\u002Fstrong> to claim your chair — and come with a few answers ready, so we can place you at the right end of the table from the very first Saturday.<\u002Fp>\n\n      <div class=\"rsvp-card\">\n        <div class=\"rsvp-how\">\n          <div class=\"rsvp-how-label\">To RSVP<\u002Fdiv>\n          <p class=\"rsvp-how-text\">Send me a message and say you’d like a seat.<\u002Fp>\n          <div class=\"rsvp-signed\">— with warmth, Dilnaz<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rsvp-prep\">\n          <div class=\"rsvp-prep-label\">Come with intentions for these<\u002Fdiv>\n          <ol class=\"prep-list\">\n            <li>\n              <span class=\"prep-num\">01<\u002Fspan>\n              <span class=\"prep-body\"><strong>What are you building?<\u002Fstrong><span>A novel, a brand, a research paper, a small bakery, a team — a sentence is plenty.<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n            <li>\n              <span class=\"prep-num\">02<\u002Fspan>\n              <span class=\"prep-body\"><strong>Where are you in the journey?<\u002Fstrong><span>Just a glimmer · sketching it out · building a first version · already shipped &amp; iterating · restarting after a pause.<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n            <li>\n              <span class=\"prep-num\">03<\u002Fspan>\n              <span class=\"prep-body\"><strong>Your preferred room.<\u002Fstrong><span>Living room &amp; slow Saturday · a café with the right hum · the big studio table · a quiet campus corner · surprise me.<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n            <li>\n              <span class=\"prep-num\">04<\u002Fspan>\n              <span class=\"prep-body\"><strong>What would make this valuable for you?<\u002Fstrong><span>Honest feedback, accountability, a few hours away from the noise, or simply people who are also in the messy middle.<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer>\n      <div>The Builder Table <span class=\"dot\" style=\"display:inline-block;width:5px;height:5px;background:var(--terracotta);border-radius:50%;margin:0 8px;vertical-align:middle;\"><\u002Fspan> Est. 2026<\u002Fdiv>\n      <div class=\"signed\">— with warmth, Dilnaz.<\u002Fdiv>\n      <div>RSVP · By Message · The Friday Before<\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
